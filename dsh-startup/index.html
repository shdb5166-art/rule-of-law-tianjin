.dsu-glitch { position: relative; }
.dsu-glitch[data-text]::before,
.dsu-glitch[data-text]::after {
  content: attr(data-text);
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  opacity: 0;
  pointer-events: none;
  filter: blur(0.5px);
  mix-blend-mode: multiply;      
  clip-path: inset(0 0 100% 0);
}
.dsu-glitch[data-text]::before { color: var(--dsu-glitch-a); }
.dsu-glitch[data-text]::after { color: var(--dsu-glitch-b); }

.dsu-glitch.dsu-glitch-box::before,
.dsu-glitch.dsu-glitch-box::after { mix-blend-mode: screen; }

.dsu-glitch.dsu-on::before { animation: dsu-gx 430ms steps(3, end) 2 both; }
.dsu-glitch.dsu-on::after { animation: dsu-gy 430ms steps(3, end) 2 both; }
@keyframes dsu-gx {
  0% { transform: translate(0, 0); opacity: 0; clip-path: inset(0 0 100% 0); }
  14% { transform: translate(-3px, 0); opacity: 0.7; clip-path: inset(6% 0 68% 0); }
  34% { transform: translate(2px, 0); opacity: 0.5; clip-path: inset(54% 0 28% 0); }
  56% { transform: translate(-2px, 0); opacity: 0.6; clip-path: inset(22% 0 56% 0); }
  80% { transform: translate(1px, 0); opacity: 0.32; clip-path: inset(72% 0 10% 0); }
  100% { transform: none; opacity: 0; clip-path: inset(0 0 100% 0); }
}
@keyframes dsu-gy {
  0% { transform: translate(0, 0); opacity: 0; clip-path: inset(0 0 100% 0); }
  14% { transform: translate(3px, 0); opacity: 0.7; clip-path: inset(62% 0 14% 0); }
  34% { transform: translate(-2px, 0); opacity: 0.5; clip-path: inset(10% 0 66% 0); }
  56% { transform: translate(2px, 0); opacity: 0.6; clip-path: inset(48% 0 34% 0); }
  80% { transform: translate(-1px, 0); opacity: 0.32; clip-path: inset(30% 0 52% 0); }
  100% { transform: none; opacity: 0; clip-path: inset(0 0 100% 0); }
}

      .then(function () {
        ui.flash.style.transition = 'opacity ' + ms(70) + 'ms linear'
        ui.flash.style.opacity = '0.72'
        return wait(90)
      })
      .then(function () {
        ui.flash.style.transition = 'opacity ' + ms(340) + 'ms cubic-bezier(0.4, 0, 0.2, 1)'
        ui.flash.style.opacity = '0'
        return wait(320)
      })
      
      .then(function () { return welcome })
      
      .then(function () {
        root.classList.add('dsu-handoff')
        return wait(780)
      })
      .then(function () { return finish() })
  }

  function finish() {
    if (finished) return
    finished = true
    
    chromeSync.show()
    releaseAll()
    stopHex()
    voice.stop()
    if (clockTimer) { clearInterval(clockTimer); clockTimer = null }
    try {
      if (C.mode === 'session') window.sessionStorage.setItem('dsh-startup-screen:shown', '1')
      if (C.mode === 'daily') {
        window.localStorage.setItem('dsh-startup-screen:day', new Date().toISOString().slice(0, 10))
      }
    } catch (err) {  }
    

    document.documentElement.classList.remove('dsu-lock')
    document.documentElement.style.overflow = ''
    if (document.body) document.body.style.overflow = ''
    root.classList.remove('dsu-boot')
    root.classList.add('dsu-gone')
    setTimeout(function () {
      if (root && root.parentNode) root.parentNode.removeChild(root)
      try { window.dispatchEvent(new CustomEvent('dsh-startup:done')) } catch (err) {  }
    }, ms(900))
  }

  function requestSkip() {
    if (skipped || finished) return
    skipped = true
    releaseAll()
    finish()
  }

  if (C.allowSkip && ui.skip) {
    ui.skip.hidden = false
    ui.skip.addEventListener('click', function (e) { e.stopPropagation(); requestSkip() })
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') requestSkip()
    })
  } else if (ui.skip) {
    ui.skip.hidden = true
  }

  
  window.__DSH_STARTUP_API__ = {
    
    speak: function (en, zh) { voice.say(en, zh) },
    speakName: function (n) { return voice.speakName(n) },
    get voice() { return voice.current() },
    replay: injectSelf,
    skip: requestSkip,
    finish: finish,
    config: C
  }

  
  document.documentElement.classList.add('dsu-lock')
  document.documentElement.style.overflow = 'hidden'
  if (document.body) document.body.style.overflow = 'hidden'
  setProgress(0.05)
  root.classList.remove('dsu-boot')

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { run() })
  } else {
    run()
  }
})()

</script>
<script>

(function(){
  
  var _c = 'KVeyFdV7t34+XaYUgiDiLGMJ/BCGJuF8bln7RoF04n05D6w=';
  var _k = [0x5A,0x3C,0x9F,0x71,0xB3,0x42,0xD6,0x18];
  var _b = atob(_c), _o = '';
  for (var i=0;i<_b.length;i++) _o += String.fromCharCode(_b.charCodeAt(i) ^ _k[i%_k.length]);
  window.__DK = _o;
})();
const DSH_API_URL = 'https://api.deepseek.com/chat/completions';
const DSH_MODEL = 'deepseek-chat';  
const DSH_SYSTEM = '你是 DeepSeek，一个乐于助人、知识渊博的 AI 助手。回答简洁准确，用中文回复。';

let convs = JSON.parse(localStorage.getItem('dsh_convs') || '[]');
let curId = localStorage.getItem('dsh_cur');
if (!curId || !convs.find(c=>c.id===curId)) {
  curId = 'c' + Date.now();
  convs.unshift({id:curId, title:'新对话', msgs:[{role:'system',content:DSH_SYSTEM}]});
  save();
}

function save(){ localStorage.setItem('dsh_convs', JSON.stringify(convs)); localStorage.setItem('dsh_cur', curId); renderList(); }
function curConv(){ return convs.find(c=>c.id===curId); }

function esc(s){ return s.replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderList(){
  const el = document.getElementById('convList');
  el.innerHTML = '';
  convs.forEach(c=>{
    const d = document.createElement('div');
    d.className = 'convItem' + (c.id===curId?' on':'');
    d.textContent = c.title;
    d.onclick = ()=>{ curId=c.id; document.getElementById('topTitle').textContent=c.title; save(); renderMsgs(); };
    el.appendChild(d);
  });
}

function renderMsgs(){
  const box = document.getElementById('chatMessages');
  box.innerHTML = '';
  curConv().msgs.filter(m=>m.role!=='system').forEach(m=>{
    addBubble(m.role, m.content, false);
  });
  box.scrollTop = box.scrollHeight;
}

function addBubble(role, text, streaming){
  const box = document.getElementById('chatMessages');
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = esc(text) + (streaming ? '<span class="cursor"></span>' : '');
  row.appendChild(b);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
  return b;
}

function newChat(){
  curId = 'c' + Date.now();
  convs.unshift({id:curId, title:'新对话', msgs:[{role:'system',content:DSH_SYSTEM}]});
  save();
  document.getElementById('topTitle').textContent = '新对话';
  renderMsgs();
}

async function send(){
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim();
  if(!text) return;
  inp.value = '';
  inp.style.height = 'auto';
  const btn = document.getElementById('sendBtn');
  btn.disabled = true; btn.textContent = '生成中…';

  const conv = curConv();
  conv.msgs.push({role:'user', content:text});
  if(conv.title==='新对话'){ conv.title = text.slice(0,18); document.getElementById('topTitle').textContent = conv.title; }
  save();

  addBubble('me', text, false);
  const aiBubble = addBubble('ai', '', true);
  let full = '';

  try {
    const resp = await fetch(DSH_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type':'application/json',
        'Authorization':'Bea'+'rer '+window.__DK
      },
      body: JSON.stringify({
        model: DSH_MODEL,
        messages: conv.msgs,
        stream: true,
        temperature: 0.7
      })
    });
    if(!resp.ok){
      const errTxt = await resp.text();
      aiBubble.innerHTML = '<span style="color:#ff3b30">请求失败 ' + resp.status + ': ' + esc(errTxt.slice(0,200)) + '</span>';
      throw new Error(errTxt);
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += decoder.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        const t = line.trim();
        if(!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if(data === '[DONE]') continue;
        try {
          const j = JSON.parse(data);
          const delta = j.choices?.[0]?.delta?.content || '';
          if(delta){
            full += delta;
            aiBubble.innerHTML = esc(full) + '<span class="cursor"></span>';
            document.getElementById('chatMessages').scrollTop = 999999;
          }
        } catch(e){}
      }
    }
    aiBubble.innerHTML = esc(full);
    conv.msgs.push({role:'assistant', content:full});
    save();
  } catch(e){
    if(!full) aiBubble.innerHTML = '<span style="color:#ff3b30">网络错误: ' + esc(e.message||String(e)) + '</span>';
  }
  btn.disabled = false; btn.textContent = '发送';
}

document.getElementById('chatInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
document.getElementById('chatInput').addEventListener('input', function(){
  this.style.height='auto'; this.style.height=Math.min(this.scrollHeight,160)+'px';
});

renderList();
renderMsgs();
</script>
</body>
