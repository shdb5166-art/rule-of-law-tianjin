<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐播放器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  color: #fff;
}

/* 双层背景 - 用于渐变切换 */
.bg-layer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  background: url('images/bg.gif') center/cover no-repeat;
  filter: blur(1px) brightness(0.5);
  transform: scale(1.05);
  transition: opacity 0.8s ease;
}

.bg-layer-2 {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  background: center/cover no-repeat;
  filter: blur(40px) brightness(0.4) saturate(1.2);
  transform: scale(1.15);
  opacity: 0;
  transition: opacity 0.8s ease;
}

.bg-mask {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.3) 100%);
}

/* 顶部导航 */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
}

.top-btn {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none;
  color: #fff; cursor: pointer;
  opacity: 0.9;
}

.top-btn svg { width: 24px; height: 24px; }

.top-title {
  text-align: center;
  flex: 1;
}

.top-title .song {
  font-size: 16px;
  font-weight: 600;
  color: #fff;
}

.top-title .artist {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  margin-top: 2px;
}

/* 主内容区 */
.main-content {
  position: relative;
  z-index: 10;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 60px 20px 160px;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
}

/* 左侧专辑封面 */
.album-section {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  position: relative;
}

.album-cover {
  width: 240px;
  height: 240px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  position: relative;
}

.album-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  position: absolute;
  top: 0; left: 0;
  transition: opacity 0.6s ease, transform 0.6s ease;
}

.album-cover img.fade-out {
  opacity: 0;
  transform: scale(0.95);
}

/* 右侧歌词区 */
.lyrics-section {
  flex: 1;
  min-width: 450px;
  height: 500px;
  border-radius: 24px;
  background: linear-gradient(135deg, rgba(20,20,30,0.55) 0%, rgba(10,10,20,0.45) 100%);
  backdrop-filter: blur(25px) saturate(1.4);
  -webkit-backdrop-filter: blur(25px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(0,0,0,0.2);
  position: relative;
  overflow: hidden;
}

.lyrics-section::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
  pointer-events: none;
  border-radius: 24px 24px 0 0;
}

.lyrics-header {
  padding: 10px 20px 6px;
  text-align: center;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.lyrics-header .title {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 2px;
}

.lyrics-header .meta {
  font-size: 10px;
  color: rgba(255,255,255,0.45);
}

.lyrics-container {
  height: calc(100% - 48px);
  overflow: hidden;
  position: relative;
  padding: 8px 0;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}

.lyrics-container:active { cursor: grabbing; }

.lyrics-mask-top,
.lyrics-mask-bottom {
  position: absolute;
  left: 0; right: 0;
  height: 40px;
  z-index: 5;
  pointer-events: none;
}

.lyrics-mask-top {
  top: 0;
  background: linear-gradient(180deg, rgba(20,20,30,0.4) 0%, transparent 100%);
}

.lyrics-mask-bottom {
  bottom: 0;
  background: linear-gradient(0deg, rgba(20,20,30,0.4) 0%, transparent 100%);
}

.lyrics-list {
  transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
  will-change: transform;
}

.lyrics-list.dragging { transition: none; }

.lyrics-line {
  text-align: center;
  font-size: 16px;
  color: rgba(255,255,255,0.4);
  line-height: 2.4;
  transition: all 0.3s;
  cursor: pointer;
  padding: 0 16px;
}

.lyrics-line.active {
  color: #fff;
  font-size: 19px;
  font-weight: 600;
  text-shadow: 0 0 20px rgba(255,255,255,0.5);
}

.lyrics-line:hover { color: rgba(255,255,255,0.7); }

/* 底部控制区 */
.player-controls {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: calc(100% - 40px);
  max-width: 700px;
  padding: 10px 24px 14px;
  background: linear-gradient(135deg, rgba(15,15,25,0.6) 0%, rgba(8,8,15,0.5) 100%);
  backdrop-filter: blur(30px) saturate(1.5);
  -webkit-backdrop-filter: blur(30px) saturate(1.5);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 28px;
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.12);
}

.player-controls::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
}

/* 进度条 */
.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.time-text {
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  font-variant-numeric: tabular-nums;
  min-width: 40px;
}

.time-text.right { text-align: right; }

.progress-bar {
  flex: 1;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}

.progress-fill {
  height: 100%;
  background: #fff;
  border-radius: 2px;
  width: 0%;
  position: relative;
}

.progress-fill::after {
  content: '';
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  opacity: 0;
  transition: opacity 0.2s;
}

.progress-bar:hover .progress-fill::after { opacity: 1; }

/* 控制按钮行 */
.control-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 500px;
  margin: 0 auto;
}

.control-side {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 60px;
}

.control-side.right { justify-content: flex-end; }

.control-center {
  display: flex;
  align-items: center;
  gap: 24px;
}

.ctrl-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none;
  color: rgba(255,255,255,0.75);
  cursor: pointer;
  transition: all 0.2s;
}

.ctrl-btn:hover { color: #fff; transform: scale(1.1); }
.ctrl-btn svg { width: 22px; height: 22px; }

.ctrl-btn.active { color: #4fc3f7; }

.play-btn {
  width: 48px; height: 48px;
  background: rgba(255,255,255,0.95);
  border-radius: 50%;
  color: #333;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}

.play-btn:hover {
  background: #fff;
  transform: scale(1.05);
  color: #333;
}

.play-btn svg { width: 24px; height: 24px; }

/* iOS风格小圆点切换UI */
.ios-switcher {
  position: fixed;
  right: -24px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.ios-switcher.expanded {
  right: 16px;
}

.ios-dot {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(15,15,25,0.6);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  overflow: hidden;
  position: relative;
}

.ios-dot:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}

.ios-dot svg {
  width: 20px;
  height: 20px;
  color: #fff;
  transition: transform 0.3s;
}

.ios-switcher.expanded .ios-dot.main svg {
  transform: rotate(45deg);
}

.ios-dot.song-item {
  width: 44px;
  height: 44px;
  opacity: 0;
  transform: scale(0.5);
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.ios-switcher.expanded .ios-dot.song-item {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

.ios-dot.song-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

.ios-dot.song-item.current {
  border: 2px solid #4fc3f7;
  box-shadow: 0 0 12px rgba(79,195,247,0.5);
}

.ios-dot.song-item .song-label {
  position: absolute;
  right: 56px;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(0,0,0,0.7);
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 11px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

.ios-dot.song-item:hover .song-label {
  opacity: 1;
}

/* 网页切换按钮 */
.ios-dot.web-switch {
  width: 44px;
  height: 44px;
  opacity: 0;
  transform: scale(0.5);
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.ios-switcher.expanded .ios-dot.web-switch {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

.ios-dot.web-switch svg {
  width: 24px;
  height: 24px;
}

.ios-dot.divider {
  width: 30px;
  height: 1px;
  background: rgba(255,255,255,0.2);
  border-radius: 1px;
  opacity: 0;
  transition: opacity 0.3s;
}

.ios-switcher.expanded .ios-dot.divider {
  opacity: 1;
}

/* Windows右键菜单风格 */
.win-context-menu {
  position: fixed;
  z-index: 300;
  min-width: 180px;
  background: rgba(32, 32, 32, 0.95);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  box-shadow: 
    0 8px 32px rgba(0,0,0,0.5),
    0 2px 8px rgba(0,0,0,0.3);
  padding: 6px 0;
  opacity: 0;
  transform: scale(0.9) translateY(-5px);
  pointer-events: none;
  transition: all 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  transform-origin: top right;
}

.win-context-menu.show {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: auto;
}

.win-menu-header {
  padding: 8px 16px 6px;
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 4px;
}

.win-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  cursor: pointer;
  transition: background 0.15s;
  font-size: 13px;
  color: rgba(255,255,255,0.85);
}

.win-menu-item:hover {
  background: rgba(79,195,247,0.2);
  color: #fff;
}

.win-menu-item.active {
  background: rgba(79,195,247,0.15);
  color: #4fc3f7;
}

.win-menu-item .menu-icon {
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.win-menu-item .menu-icon svg {
  width: 16px;
  height: 16px;
}

.win-menu-item .menu-text {
  flex: 1;
}

.win-menu-item .menu-shortcut {
  font-size: 11px;
  color: rgba(255,255,255,0.35);
}

.win-menu-item .new-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 1px 8px;
  border: 1px solid rgba(79,195,247,0.55);
  background: rgba(79,195,247,0.12);
  border-radius: 999px;
  font-size: 10px;
  color: #4fc3f7;
  font-style: italic;
  letter-spacing: 0.3px;
  vertical-align: middle;
}

.win-menu-item .ext-tag {
  margin-left: 6px;
  font-size: 10px;
  color: rgba(255,255,255,0.35);
  vertical-align: middle;
}

.win-menu-divider {
  height: 1px;
  background: rgba(255,255,255,0.08);
  margin: 4px 8px;
}

/* 半透毛玻璃风格公告弹窗 */
.win-dialog-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}

.win-dialog-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.win-dialog {
  width: 380px;
  max-width: calc(100% - 40px);
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(30px) saturate(1.5);
  -webkit-backdrop-filter: blur(30px) saturate(1.5);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 24px;
  box-shadow: 
    0 8px 40px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.2);
  overflow: hidden;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  transform: scale(0.92) translateY(12px);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.win-dialog-overlay.show .win-dialog {
  transform: scale(1) translateY(0);
}

.win-dialog-titlebar {
  padding: 16px 20px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.win-dialog-title {
  color: rgba(255,255,255,0.95);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.3px;
}

.win-dialog-close {
  width: 28px;
  height: 28px;
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 50%;
  color: rgba(255,255,255,0.8);
  font-size: 16px;
  font-weight: 300;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  transition: all 0.2s;
}

.win-dialog-close:hover {
  background: rgba(255,255,255,0.25);
  color: #fff;
}

.win-dialog-body {
  padding: 8px 24px 20px;
}

.win-dialog-content {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.win-dialog-icon {
  display: none;
}

.win-dialog-text {
  flex: 1;
  min-width: 0;
}

.win-dialog-heading {
  font-size: 17px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 12px;
  line-height: 1.4;
  text-shadow: 0 1px 4px rgba(0,0,0,0.15);
}

.win-dialog-desc {
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  line-height: 1.8;
  margin-bottom: 4px;
}

.win-dialog-desc .label {
  color: rgba(255,255,255,0.6);
}

.win-dialog-desc .value {
  color: #fff;
}

.win-dialog-desc .email {
  color: #82cfff;
  text-decoration: none;
  cursor: pointer;
}

.win-dialog-footer {
  padding: 0 20px 20px;
  display: flex;
  justify-content: stretch;
}

.win-dialog-btn {
  flex: 1;
  height: 40px;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 14px;
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.win-dialog-btn:hover {
  background: rgba(255,255,255,0.3);
}

.win-dialog-btn:active {
  background: rgba(255,255,255,0.15);
  transform: scale(0.98);
}

.win-dialog-btn.primary {
  background: rgba(255,255,255,0.9);
  color: #333;
  border: none;
}

.win-dialog-btn.primary:hover {
  background: #fff;
}

/* 播放列表面板 */
.playlist-panel {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  z-index: 150;
  width: calc(100% - 40px);
  max-width: 400px;
  max-height: 420px;
  background: linear-gradient(135deg, rgba(15,15,25,0.85) 0%, rgba(8,8,15,0.8) 100%);
  backdrop-filter: blur(30px) saturate(1.5);
  -webkit-backdrop-filter: blur(30px) saturate(1.5);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  overflow: hidden;
}

.playlist-panel.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}

.playlist-header {
  padding: 14px 20px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.playlist-header .title {
  font-size: 14px;
  font-weight: 600;
}

.playlist-header .count {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
}

/* 歌单切换器 - 两卡片错开重叠 + 翻牌 */
.playlist-switcher {
  position: relative;
  height: 86px;
  margin: 14px 20px 4px;
  perspective: 700px;
}

.pl-card {
  position: absolute;
  left: 50%;
  top: 0;
  width: 150px;
  height: 72px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.15);
  background: linear-gradient(135deg, rgba(35,35,50,0.95) 0%, rgba(20,20,35,0.9) 100%);
  box-shadow: 0 6px 20px rgba(0,0,0,0.45);
  transition: transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.4s ease, filter 0.4s ease, box-shadow 0.4s ease;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  user-select: none;
  -webkit-user-select: none;
}

.pl-card .pl-card-cover {
  width: 52px;
  height: 52px;
  border-radius: 10px;
  overflow: hidden;
  flex-shrink: 0;
}

.pl-card .pl-card-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.pl-card .pl-card-info {
  flex: 1;
  min-width: 0;
}

.pl-card .pl-card-name {
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pl-card .pl-card-count {
  font-size: 10px;
  color: rgba(255,255,255,0.5);
  margin-top: 3px;
}

/* 激活卡片（在上面） */
.pl-card.active {
  transform: translateX(-50%) translateX(-8px) translateY(0) rotate(0deg) scale(1);
  z-index: 2;
  opacity: 1;
  filter: none;
  border-color: rgba(79,195,247,0.45);

/* 非激活卡片（错开重叠在下面） */
.pl-card.inactive {
  transform: translateX(-50%) translateX(16px) translateY(6px) rotate(4deg) scale(0.92);
  z-index: 1;
  opacity: 0.78;
  filter: brightness(0.75);
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
}

/* 翻牌动画类 - 目标卡片从下方翻上来 */
.pl-card.flip-to-top {
  animation: flipToTop 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
}

.pl-card.flip-to-bottom {
  animation: flipToBottom 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
}

@keyframes flipToTop {
  0% {
    transform: translateX(-50%) translateX(16px) translateY(6px) rotate(4deg) scale(0.92);
    opacity: 0.78;
    z-index: 1;
  }
  40% {
    transform: translateX(-50%) translateX(4px) translateY(2px) rotate(2deg) scale(0.96);
    opacity: 0.9;
    z-index: 3;
  }
  100% {
    transform: translateX(-50%) translateX(-8px) translateY(0) rotate(0deg) scale(1);
    opacity: 1;
    z-index: 2;
    filter: none;
  }
}

@keyframes flipToBottom {
  0% {
    transform: translateX(-50%) translateX(-8px) translateY(0) rotate(0deg) scale(1);
    opacity: 1;
    z-index: 2;
  }
  60% {
    transform: translateX(-50%) translateX(8px) translateY(3px) rotate(2deg) scale(0.95);
    opacity: 0.85;
    z-index: 1;
  }
  100% {
    transform: translateX(-50%) translateX(16px) translateY(6px) rotate(4deg) scale(0.92);
    opacity: 0.78;
    z-index: 1;
    filter: brightness(0.75);

// ===== 歌单切换器 =====
function initPlaylistSwitcher() {
  playlistSwitcher.innerHTML = '';
  playlistOrder.forEach((pid, idx) => {
    const pl = playlists[pid];
    const card = document.createElement('div');
    card.className = 'pl-card' + (pid === currentPlaylist ? ' active' : ' inactive');
    card.dataset.playlist = pid;
    const cover = pl.songs[0] ? pl.songs[0].cover : '';
    card.innerHTML = `
      <div class="pl-card-cover"><img src="${cover}" alt=""></div>
      <div class="pl-card-info">
        <div class="pl-card-name">${pl.name}</div>
        <div class="pl-card-count">${pl.songs.length} 首</div>
      </div>
    `;
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      if (switchingPlaylist) return;
      switchPlaylist(pid);
    });
    playlistSwitcher.appendChild(card);
  });
}

// 切换歌单（翻卡片动画）
function switchPlaylist(pid) {
  if (pid === currentPlaylist || switchingPlaylist) return;
  switchingPlaylist = true;

  const oldCard = playlistSwitcher.querySelector('.pl-card.active');
  const newCard = playlistSwitcher.querySelector(`.pl-card[data-playlist="${pid}"]`);
  if (!oldCard || !newCard) { switchingPlaylist = false; return; }

  // 旧卡片翻下去
  oldCard.classList.remove('active');
  oldCard.classList.add('flip-to-bottom');
  // 新卡片翻上来
  newCard.classList.remove('inactive');
  newCard.classList.add('flip-to-top');

  const wasPlaying = isPlaying;

  setTimeout(() => {
    // 动画结束，更新状态
    oldCard.classList.remove('flip-to-bottom');
    oldCard.classList.add('inactive');
    newCard.classList.remove('flip-to-top');
    newCard.classList.add('active');

    currentPlaylist = pid;
    currentSongIndex = 0;

    // 切换播放列表内容
    renderPlaylist();
    // 切换当前歌曲
    switchSong(0, true);

    // 重建 iOS 小圆点
    rebuildIosDots();

    switchingPlaylist = false;
  }, 500);
}

// ===== 播放列表渲染 =====
function renderPlaylist() {
  const songs = getCurrentSongs();
  playlistTitle.textContent = playlists[currentPlaylist].name;
  playlistCount.textContent = songs.length + '首';
  playlistItems.innerHTML = '';
  songs.forEach((song, index) => {
    const item = document.createElement('div');
    item.className = 'playlist-item' + (index === currentSongIndex ? ' active' : '');
    item.innerHTML = `
      <span class="item-index">${index + 1}</span>
      <div class="item-cover"><img src="${song.cover}" alt=""></div>
      <div class="item-info">
        <div class="item-name">${song.name}</div>
        <div class="item-artist">${song.artist}</div>
      </div>
    `;
    item.addEventListener('click', () => {
      switchSong(index);
      playlistPanel.classList.remove('show');
    });
    playlistItems.appendChild(item);
  });
}

// ===== iOS 小圆点重建 =====
function rebuildIosDots() {
  iosSongDots.innerHTML = '';
  const songs = getCurrentSongs();
  songs.forEach((song, index) => {
    if (index >= 2) return; // 第三首及以后合并到"更多"菜单
    const dot = document.createElement('div');
    dot.className = 'ios-dot song-item' + (index === currentSongIndex ? ' current' : '');
    dot.dataset.index = index;
    dot.innerHTML = `
      <img src="${song.cover}" alt="">
      <span class="song-label">${song.name}</span>
    `;
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      const i = parseInt(dot.dataset.index);
      switchSong(i);
      iosSwitcher.classList.remove('expanded');
    });
    iosSongDots.appendChild(dot);
  });

  // 第三个及以后合并成"更多歌曲"按钮
  if (songs.length > 2) {
    const more = document.createElement('div');
    more.className = 'ios-dot song-item';
    more.id = 'moreSongsBtn';
    more.title = '更多歌曲';
    more.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>`;
    more.addEventListener('click', (e) => {
      e.stopPropagation();
      showSongMenu(more);
    });
    iosSongDots.appendChild(more);
  }
}

// 歌曲列表菜单(win 风格)
function showSongMenu(anchor) {
  let menu = document.getElementById('songContextMenu');
  if (!menu) {
    menu = document.createElement('div');
    menu.id = 'songContextMenu';
    menu.className = 'win-context-menu';
    document.body.appendChild(menu);
  }
  const songs = getCurrentSongs();
  menu.innerHTML = '<div class="win-menu-header">选择歌曲</div>';
  songs.forEach((song, i) => {
    const item = document.createElement('div');
    item.className = 'win-menu-item' + (i === currentSongIndex ? ' active' : '');
    item.innerHTML = `
      <div class="menu-icon"><img src="${song.cover}" style="width:18px;height:18px;border-radius:4px;object-fit:cover"/></div>
      <span class="menu-text">${song.name}</span>
    `;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.remove('show');
      iosSwitcher.classList.remove('expanded');
      switchSong(i);
    });
    menu.appendChild(item);
  });
  const rect = anchor.getBoundingClientRect();
  menu.style.top = (rect.top - 10) + 'px';
  menu.style.right = (window.innerWidth - rect.left + 10) + 'px';
  menu.classList.add('show');
}

// 切换歌曲
function switchSong(index, force) {
  const songs = getCurrentSongs();
  if (!force && index === currentSongIndex) return;

  const wasPlaying = isPlaying;
  currentSongIndex = index;
  const song = getCurrentSong();

  // 更新音频
  audio.src = song.audio;
  audio.currentTime = 0;

  // 更新文字
  topSongName.textContent = song.name;
  topArtistName.textContent = song.artist;
  lyricsTitle.textContent = song.name;
  lyricsMeta.textContent = song.meta;

  // 切换封面（渐变）
  const newCover = song.cover;
  if (isCover1Active) {
    coverImg2.src = newCover;
    coverImg2.style.opacity = '1';
    coverImg1.style.opacity = '0';
  } else {
    coverImg1.src = newCover;
    coverImg1.style.opacity = '1';
    coverImg2.style.opacity = '0';
  }
  isCover1Active = !isCover1Active;

  // 切换背景
  if (song.bg === 'gif') {
    if (isCover1Active) {
      bgLayer2.style.backgroundImage = "url('images/bg.gif')";
      bgLayer2.style.filter = 'blur(1px) brightness(0.5)';
      bgLayer2.style.transform = 'scale(1.05)';
      bgLayer2.style.opacity = '1';
      bgLayer1.style.opacity = '0';
    } else {
      bgLayer1.style.backgroundImage = "url('images/bg.gif')";
      bgLayer1.style.filter = 'blur(1px) brightness(0.5)';
      bgLayer1.style.transform = 'scale(1.05)';
      bgLayer1.style.opacity = '1';
      bgLayer2.style.opacity = '0';
    }
  } else if (song.bg === 'amiya') {
    if (isCover1Active) {
      bgLayer2.style.backgroundImage = "url('images/bg-amiya.gif')";
      bgLayer2.style.backgroundSize = '20%';
      bgLayer2.style.backgroundPosition = 'center';
      bgLayer2.style.filter = 'blur(1px) brightness(0.5)';
      bgLayer2.style.transform = 'none';
      bgLayer2.style.opacity = '1';
      bgLayer1.style.opacity = '0';
    } else {
      bgLayer1.style.backgroundImage = "url('images/bg-amiya.gif')";
      bgLayer1.style.backgroundSize = '20%';
      bgLayer1.style.backgroundPosition = 'center';
      bgLayer1.style.filter = 'blur(1px) brightness(0.5)';
      bgLayer1.style.transform = 'none';
      bgLayer1.style.opacity = '1';
      bgLayer2.style.opacity = '0';
    }
  } else {
    if (isCover1Active) {
      bgLayer2.style.backgroundImage = `url('${song.cover}')`;
      bgLayer2.style.filter = 'blur(40px) brightness(0.4) saturate(1.2)';
      bgLayer2.style.transform = 'scale(1.15)';
      bgLayer2.style.opacity = '1';
      bgLayer1.style.opacity = '0';
    } else {
      bgLayer1.style.backgroundImage = `url('${song.cover}')`;
      bgLayer1.style.filter = 'blur(40px) brightness(0.4) saturate(1.2)';
      bgLayer1.style.transform = 'scale(1.15)';
      bgLayer1.style.opacity = '1';
      bgLayer2.style.opacity = '0';
    }
  }

  // 更新歌词
  initLyrics();
  currentLyricIndex = -1;
  manualOffset = 0;
  userScrolled = false;
  scrollToLyric(0);

  // 更新播放列表高亮
  document.querySelectorAll('.playlist-item').forEach((item, i) => {
    item.classList.toggle('active', i === index);
  });

  // 更新iOS小圆点高亮
  document.querySelectorAll('.ios-dot.song-item').forEach((item, i) => {
    item.classList.toggle('current', i === index);
  });

  // 播放
  if (wasPlaying || force) {
    audio.play().catch(e => console.error('播放失败:', e));
  }
}

// 初始化歌词
function initLyrics() {
  const lyrics = getCurrentSong().lyrics;
  lyricsList.innerHTML = '';
  lyrics.forEach((item, index) => {
    const line = document.createElement('div');
    line.className = 'lyrics-line';
    line.textContent = item.text;
    line.dataset.index = index;
    line.addEventListener('click', () => {
      audio.currentTime = item.time;
      if (!isPlaying) togglePlay();
    });
    lyricsList.appendChild(line);
  });
}

// 滚动歌词
function scrollToLyric(index) {
  const lyrics = getCurrentSong().lyrics;
  if (index < 0 || index >= lyrics.length) return;
  const lines = lyricsList.querySelectorAll('.lyrics-line');
  const lineHeight = lines[0] ? lines[0].offsetHeight : 38;
  const containerHeight = lyricsContainer.offsetHeight;
  const offset = containerHeight / 2 - lineHeight / 2;
  const baseTranslateY = -(index * lineHeight) + offset;
  const finalTranslateY = baseTranslateY + manualOffset;
  lyricsList.style.transform = `translateY(${finalTranslateY}px)`;
}

function applyManualScroll() {
  const lines = lyricsList.querySelectorAll('.lyrics-line');
  const lineHeight = lines[0] ? lines[0].offsetHeight : 38;
  const containerHeight = lyricsContainer.offsetHeight;
  const offset = containerHeight / 2 - lineHeight / 2;
  const baseTranslateY = -(currentLyricIndex * lineHeight) + offset;
  lyricsList.style.transform = `translateY(${baseTranslateY + manualOffset}px)`;
}

function resetManualScroll() {
  manualOffset = 0;
  userScrolled = false;
  lyricsList.classList.remove('dragging');
  scrollToLyric(currentLyricIndex);
}

function startAutoReturnTimer() {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => { resetManualScroll(); }, 10000);
}

function updateLyrics(currentTime) {
  const lyrics = getCurrentSong().lyrics;
  let newIndex = -1;
  for (let i = lyrics.length - 1; i >= 0; i--) {
    if (currentTime >= lyrics[i].time) {
      newIndex = i;
      break;
    }
  }

  if (newIndex !== currentLyricIndex) {
    const lines = lyricsList.querySelectorAll('.lyrics-line');
    if (currentLyricIndex >= 0 && lines[currentLyricIndex]) {
      lines[currentLyricIndex].classList.remove('active');
    }
    if (newIndex >= 0 && lines[newIndex]) {
      lines[newIndex].classList.add('active');
    }
    currentLyricIndex = newIndex;
    if (!userScrolled) scrollToLyric(newIndex);
  }
}

function clampOffset(offset) {
  const lyrics = getCurrentSong().lyrics;
  const lines = lyricsList.querySelectorAll('.lyrics-line');
  const lineHeight = lines[0] ? lines[0].offsetHeight : 38;
  const maxOffset = lyrics.length * lineHeight;
  return Math.max(-maxOffset, Math.min(maxOffset, offset));
}

// 歌词滚动事件
lyricsContainer.addEventListener('wheel', (e) => {
  e.preventDefault();
  userScrolled = true;
  lyricsList.classList.add('dragging');
  manualOffset = clampOffset(manualOffset + e.deltaY);
  applyManualScroll();
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => { resetManualScroll(); }, 10000);
}, { passive: false });

lyricsContainer.addEventListener('touchstart', (e) => {
  isDragging = true;
  dragStartY = e.touches[0].clientY;
  dragStartOffset = manualOffset;
  userScrolled = true;
  lyricsList.classList.add('dragging');
  clearTimeout(scrollTimeout);
}, { passive: true });

lyricsContainer.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  e.preventDefault();
  const diff = e.touches[0].clientY - dragStartY;
  manualOffset = clampOffset(dragStartOffset + diff);
  applyManualScroll();
}, { passive: false });

lyricsContainer.addEventListener('touchend', () => {
  isDragging = false;
  startAutoReturnTimer();
});

lyricsContainer.addEventListener('mousedown', (e) => {
  isDragging = true;
  dragStartY = e.clientY;
  dragStartOffset = manualOffset;
  userScrolled = true;
  lyricsList.classList.add('dragging');
  clearTimeout(scrollTimeout);
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const diff = e.clientY - dragStartY;
  manualOffset = clampOffset(dragStartOffset + diff);
  applyManualScroll();
});

document.addEventListener('mouseup', () => {
  if (isDragging) {
    isDragging = false;
    startAutoReturnTimer();
  }
});

function formatTime(seconds) {
  if (!isFinite(seconds)) return '00:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function togglePlay() {
  if (audio.paused) {
    audio.play().catch(e => console.error('播放失败:', e));
  } else {
    audio.pause();
  }
}

playBtn.addEventListener('click', togglePlay);

audio.addEventListener('play', () => {
  isPlaying = true;
  playIcon.style.display = 'none';
  pauseIcon.style.display = 'block';
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  playIcon.style.display = 'block';
  pauseIcon.style.display = 'none';
});

audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = formatTime(audio.duration);
});

audio.addEventListener('error', () => {
  totalTimeEl.textContent = '加载失败';
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    progressFill.style.width = percent + '%';
    currentTimeEl.textContent = formatTime(audio.currentTime);
    updateLyrics(audio.currentTime);
  }
});

// 歌曲结束自动下一首
audio.addEventListener('ended', () => {
  if (!isLoop) {
    nextSong();
  }
});

progressBar.addEventListener('click', (e) => {
  const rect = progressBar.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  if (audio.duration) {
    audio.currentTime = percent * audio.duration;
  }
});

function prevSong() {
  const songs = getCurrentSongs();
  const newIndex = (currentSongIndex - 1 + songs.length) % songs.length;
  switchSong(newIndex);
}

function nextSong() {
  const songs = getCurrentSongs();
  const newIndex = (currentSongIndex + 1) % songs.length;
  switchSong(newIndex);
}

prevBtn.addEventListener('click', prevSong);
nextBtn.addEventListener('click', nextSong);

loopBtn.addEventListener('click', () => {
  isLoop = !isLoop;
  audio.loop = isLoop;
  loopBtn.classList.toggle('active', isLoop);
});

// 播放列表面板
playlistBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  playlistPanel.classList.toggle('show');
});

// iOS小圆点切换
iosMainBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  iosSwitcher.classList.toggle('expanded');
});

// 网页切换按钮 - 显示Windows右键菜单
webSwitchBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const rect = webSwitchBtn.getBoundingClientRect();
  webContextMenu.style.top = (rect.top - 10) + 'px';
  webContextMenu.style.right = (window.innerWidth - rect.left + 10) + 'px';
  webContextMenu.classList.toggle('show');
});

// 菜单项点击 - 跳转到对应网页或显示公告
document.querySelectorAll('.win-menu-item[data-web]').forEach(item => {
  item.addEventListener('click', (e) => {
    e.stopPropagation();
    const web = item.dataset.web;
    webContextMenu.classList.remove('show');
    iosSwitcher.classList.remove('expanded');

    if (web === 'music') {
      // 当前页面，不跳转
    } else if (web === 'ff0wiki') {
      window.open('https://studio.warfarin.wiki/char?id=chr_0036_jsspsi', '_blank', 'noopener');
    } else if (web === 'phigros') {
      window.location.href = '../phigros/tapToStart/index.html';
    } else if (web === 'endfield') {
      showDialog({
        heading: 'β 终末地',
        desc1: '开发中 · 进入地图构建阶段',
        desc2: '正在加载 3D 武陵地图,敬请期待。'
      });
    }
  });
});

// 显示公告弹窗
function showAnnouncement(options) {
  dialogTitle.textContent = options.title || '系统公告';
  dialogHeading.textContent = options.heading || '';
  dialogDesc1.innerHTML = options.desc1 || '';
  dialogDesc2.innerHTML = options.desc2 || '';
  announcementDialog.classList.add('show');
}

// 关闭公告弹窗
function closeAnnouncement() {
  announcementDialog.classList.remove('show');
}

dialogCloseBtn.addEventListener('click', closeAnnouncement);
dialogOkBtn.addEventListener('click', closeAnnouncement);
announcementDialog.addEventListener('click', (e) => {
  if (e.target === announcementDialog) closeAnnouncement();
});

// 关闭菜单按钮
closeMenuBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  webContextMenu.classList.remove('show');
});

// 下载整站源码 ZIP
document.getElementById('downloadZipBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  webContextMenu.classList.remove('show');
  window.open('https://github.com/shdb5166-art/rule-of-law-tianjin/archive/refs/heads/main.zip', '_blank', 'noopener');
});

// 点击UI外关闭
document.addEventListener('click', (e) => {
  if (!iosSwitcher.contains(e.target)) {
    iosSwitcher.classList.remove('expanded');
  }
  if (!playlistPanel.contains(e.target) && !playlistBtn.contains(e.target)) {
    playlistPanel.classList.remove('show');
  }
  if (!webContextMenu.contains(e.target) && !webSwitchBtn.contains(e.target)) {
    webContextMenu.classList.remove('show');
  }
  const sm = document.getElementById('songContextMenu');
  if (sm && !sm.contains(e.target) && !e.target.closest('#moreSongsBtn')) {
    sm.classList.remove('show');
  }
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.code === 'ArrowLeft') {
    audio.currentTime = Math.max(0, audio.currentTime - 5);
  } else if (e.code === 'ArrowRight') {
    audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  } else if (e.code === 'ArrowUp') {
    e.preventDefault();
    prevSong();
  } else if (e.code === 'ArrowDown') {
    e.preventDefault();
    nextSong();
  }
});

// 初始化
initPlaylistSwitcher();
renderPlaylist();
rebuildIosDots();
initLyrics();
scrollToLyric(0);
// 标记第一首为当前
document.querySelector('.ios-dot.song-item[data-index="0"]').classList.add('current');
</script>
